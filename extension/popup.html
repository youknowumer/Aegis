<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Aegis Web Hands</title>
<style>
  :root { color-scheme: light dark; --bg:#0f1720; --fg:#e6edf3; --mut:#8b98a5; --ac:#22d3ee; --ok:#16a34a; --bad:#dc2626; --bd:#243040; }
  @media (prefers-color-scheme: light) { :root { --bg:#fff; --fg:#111827; --mut:#6b7280; --ac:#0891b2; --bd:#e5e7eb; } }
  body { margin:0; width:320px; padding:14px; background:var(--bg); color:var(--fg); font:13px/1.45 system-ui, sans-serif; }
  h1 { font-size:15px; margin:0 0 4px; } p { margin:6px 0; color:var(--mut); }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-weight:600; font-size:12px; border:1px solid var(--bd); }
  .on { color:var(--ok); border-color:var(--ok); } .error { color:var(--bad); border-color:var(--bad); } .connecting { color:var(--ac); border-color:var(--ac); }
  textarea { width:100%; box-sizing:border-box; height:64px; margin-top:8px; background:transparent; color:inherit; border:1px solid var(--bd); border-radius:8px; padding:8px; font:12px ui-monospace, monospace; resize:none; }
  button { margin-top:8px; padding:7px 12px; border-radius:8px; border:1px solid var(--bd); background:var(--ac); color:#041014; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--fg); } .row { display:flex; gap:8px; }
  .err { color:var(--bad); min-height:1em; }
</style></head>
<body>
  <h1>Aegis Web Hands</h1>
  <div><span id="pill" class="pill">...</span></div>
  <p id="detail"></p>
  <p>In Aegis open <b>Settings, Browser control</b> and press <b>Copy connection code</b>, then paste it here.</p>
  <textarea id="code" placeholder="Paste connection code" spellcheck="false"></textarea>
  <div class="row"><button id="save">Connect</button><button id="off" class="ghost">Disconnect</button></div>
  <p id="err" class="err"></p>
  <p>Aegis never types passwords. Buying, sending, posting and deleting always ask you first.</p>
  <script src="popup.js"></script>
</body></html>
