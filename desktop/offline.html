<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>Aegis</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #070b12; color: #e8eef9; font: 15px system-ui, "Segoe UI", sans-serif; text-align: center; }
    .orb { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 18px; background: linear-gradient(135deg, #38d6f2, #9b8cff); box-shadow: 0 0 40px rgba(56,214,242,.5); }
    p { color: #8a99b5; max-width: 380px; margin: 8px auto 20px; }
    button { border: 0; border-radius: 10px; padding: 10px 20px; font: inherit; font-weight: 600; background: linear-gradient(135deg, #38d6f2, #9b8cff); color: #04121a; cursor: pointer; }
    code { color: #38d6f2; }
  </style>
</head>
<body>
  <div>
    <div class="orb"></div>
    <h2 id="title">Can't reach Aegis</h2>
    <p id="msg">Check your internet connection. Looking for <code id="srv"></code></p>
    <button id="retry">Try again</button>
  </div>
  <script>
    var q = new URLSearchParams(location.search), err = q.get("error"), srv = q.get("server");
    if (err) {            // the built-in server could not start: say why instead of blaming the internet
      document.getElementById("title").textContent = "Aegis could not start";
      document.getElementById("msg").textContent = err;
    } else if (srv) {
      document.getElementById("srv").textContent = srv;
    } else {
      document.getElementById("msg").textContent = "Starting the Aegis server again…";
    }
    document.getElementById("retry").onclick = () => window.aegisDesktop && window.aegisDesktop.retry();
    setTimeout(function loop() { window.aegisDesktop && window.aegisDesktop.retry(); setTimeout(loop, 8000); }, 8000);
  </script>
</body>
</html>
