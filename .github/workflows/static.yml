# Deploys the website (the static files) to GitHub Pages. The server, tests and databases are NOT published.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Collect the website files only
        run: |
          mkdir _site
          cp ./*.html ./*.js ./*.css favicon.svg favicon.ico site.webmanifest _site/
          cp -r icons fonts assets _site/
          if [ -d downloads ]; then cp -r downloads _site/; fi
      - name: Upload artifact
        # upload v3 + deploy v4 is the pair in GitHub's own static-site template (upload v3 + deploy v5 gave "Found 0 artifact(s)")
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
