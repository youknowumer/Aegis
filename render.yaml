# One-click backend on Render: dashboard -> New -> Blueprint -> pick this repo.
# NOTE: a persistent disk needs a paid instance type. On the free type the filesystem is wiped on every
# restart/redeploy, which deletes accounts, memory and chat history (SQLite lives on that disk).
services:
  - type: web
    name: aegis-server
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: aegis-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # you paste it in the Render dashboard, never in git
      - key: GROQ_API_KEY
        sync: false            # optional: Groq voice transcription, meeting notes (and chat if no Claude key)
      - key: AEGIS_JWT_SECRET
        generateValue: true
      - key: AEGIS_ALLOWED_ORIGINS
        value: https://youknowumer.github.io,https://YOUR-PROJECT.pages.dev,https://*.pages.dev   # <- your GitHub Pages origin (no /Aegis path, no trailing slash)
      - key: AEGIS_WEB_SEARCH
        value: "0"             # set to 1 after enabling web search in the Anthropic Console
      # Optional: server-wide keys for other providers. Users can also paste their own in Settings > AI provider.
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Optional (v8): studio voice with ElevenLabs (OPENAI_API_KEY above also works), and Home Assistant.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: AEGIS_HA_URL
        sync: false
      - key: AEGIS_HA_TOKEN
        sync: false
      # Optional (v16): local language voices (Meta MMS, non-commercial licence). Needs a plan with 2 GB+ RAM and a disk of 6 GB or more
      # (raise `sizeGB` above). On a smaller plan the server turns them off by itself and keeps the free Edge voice, so this is safe to try.
      # Models download themselves the first time each language is spoken. See SETUP.md > "Local language voices".
      # - key: WITH_MMS
      #   value: "1"             # also installs PyTorch at build time (Render passes service variables to Docker as build args; check your dashboard)
      # - key: AEGIS_MMS_CACHE
      #   value: "2"             # language models kept in memory
